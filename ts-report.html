<style>
/* Layout: sticky top bar with mode switch; TS app = single phone-width column, RMAS = summary tiles → TS table → store list */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --sunk:#F6F8FA; --ink:#121A2B; --muted:#5A6476; --line:#D9DFE8;
  --accent:#1F47C7; --accent-soft:#E4EAFB; --on-accent:#FFFFFF;
  --ok:#17784A; --ok-bg:#E1F3E8; --ns:#0B6F86; --ns-bg:#DDF1F6; --bad:#B9400F; --bad-bg:#FCE8DB; --warn:#946200; --warn-bg:#FAF0D2;
  --font-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131D; --surface:#161D2A; --sunk:#111723; --ink:#E7ECF4; --muted:#97A2B5; --line:#273246;
  --accent:#7D9BFF; --accent-soft:#1E2A4D; --on-accent:#0E131D;
  --ok:#5BD093; --ok-bg:#16301F; --ns:#5CC8E0; --ns-bg:#123039; --bad:#FF9A6B; --bad-bg:#3A2016; --warn:#E8BC52; --warn-bg:#352A10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131D; --surface:#161D2A; --sunk:#111723; --ink:#E7ECF4; --muted:#97A2B5; --line:#273246;
  --accent:#7D9BFF; --accent-soft:#1E2A4D; --on-accent:#0E131D;
  --ok:#5BD093; --ok-bg:#16301F; --ns:#5CC8E0; --ns-bg:#123039; --bad:#FF9A6B; --bad-bg:#3A2016; --warn:#E8BC52; --warn-bg:#352A10; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

main{padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
.phone{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.demo-note{font-size:12.5px;color:var(--muted);background:var(--warn-bg);border-radius:8px;padding:8px 10px}
.demo-note b{color:var(--warn)}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;text-transform:none;letter-spacing:0;font-weight:500}

.prog{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.prog-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.big{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1}
.big small{font-size:15px;font-weight:600;color:var(--muted)}
.bar{position:relative;height:10px;background:var(--sunk);border-radius:6px;border:1px solid var(--line);overflow:visible}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--accent)}
.bar .t80{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);left:80%}
.bar .pace{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted);opacity:.55}
.prog-foot{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);gap:8px;flex-wrap:wrap}

.sect{font-family:var(--font-display);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;margin-top:4px}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-ns{background:var(--ns-bg);color:var(--ns)} .p-bad{background:var(--bad-bg);color:var(--bad)}

.back{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0;align-self:flex-start}

.cam{display:flex;align-items:center;justify-content:center;gap:8px;min-height:120px;border:1.5px dashed var(--line);border-radius:10px;background:var(--sunk);color:var(--muted);font-weight:600;cursor:pointer;position:relative;overflow:hidden;text-align:center;padding:10px}
.cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.cam input{position:absolute;width:1px;height:1px;opacity:0}
.nophoto{font-size:13px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:9px 10px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.choices button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;font-weight:700;font-size:12.5px;line-height:1.2;min-height:52px}
.choices button[data-v="ok"][aria-pressed="true"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.choices button[data-v="ns"][aria-pressed="true"]{background:var(--ns-bg);border-color:var(--ns);color:var(--ns)}
.choices button[data-v="inc"][aria-pressed="true"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.submit{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;background:var(--bg);padding-top:6px}
.btn{border:0;border-radius:12px;padding:14px;font-weight:700;font-size:16px;background:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:12.5px;color:var(--muted);text-align:center}

/* dashboard */
.dash{display:flex;flex-direction:column;gap:18px}
.dash-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.dash-head h1{font-family:var(--font-display);font-size:26px;margin:0;letter-spacing:-.01em}
.dash-head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.weeks{display:inline-flex;gap:4px;flex-wrap:wrap}
.weeks button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px}
.weeks button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.weeks button:disabled{opacity:.4;cursor:not-allowed}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .k{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tile .v{font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1}
.tile .s{font-size:12.5px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel-h h2{margin:0;font-family:var(--font-display);font-size:16px}
.panel-h .lg{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.lg i{display:inline-block;width:2px;height:12px;vertical-align:-2px;margin-right:4px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:10px 14px;text-align:left;border-top:1px solid var(--line);font-size:13.5px;vertical-align:middle}
thead th{border-top:0;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;background:var(--sunk)}
td.r,th.r{text-align:right}
.tsn b{display:block}.tsn span{font-size:12px;color:var(--muted)}
.pcell{display:flex;align-items:center;gap:10px;min-width:180px}
.pcell .bar{flex:1}
.pcell .num{font-family:var(--font-mono);font-size:13px;width:44px;text-align:right}
.wk{display:flex;gap:4px}
.wk span{width:30px;text-align:center;font-family:var(--font-mono);font-size:12.5px;padding:3px 0;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.wk span.zero{background:var(--sunk);color:var(--muted)}
.wk span.fut{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.mix{display:flex;gap:4px;flex-wrap:wrap}

.filters{display:flex;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--sunk)}
.filters label.field{flex:1;min-width:160px}
.srow{border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow>button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;width:100%;padding:11px 14px;border:0;background:transparent;text-align:left;align-items:center}
.srow>button:hover{background:var(--sunk)}
.srow .nm{font-weight:600}
.srow .sub{font-size:12.5px;color:var(--muted)}
.srow .tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.sdet{padding:4px 14px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dcard{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk);display:flex;flex-direction:column}
.dcard .ph{aspect-ratio:4/3;max-width:100%;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--muted);text-align:center;padding:6px}
.dcard .ph img{width:100%;height:100%;object-fit:cover}
.dcard .dl{padding:8px;display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600}
.more{display:block;width:100%;padding:12px;border:0;border-top:1px solid var(--line);background:var(--surface);color:var(--accent);font-weight:600}
.callout{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--ink)}
.callout b{color:var(--accent)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .25s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
.row .tags,.srow .tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.hello{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:2px 0;font-size:13px;text-decoration:underline;text-underline-offset:2px}
.errbox{background:var(--bad-bg);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:13.5px}
.errbox b{color:var(--bad)} .errbox ul{margin:6px 0;padding-left:18px}
input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;text-transform:none;letter-spacing:0;font-weight:500}
.ctrls{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap;font-family:var(--font-display)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.cnt{display:inline-block;min-width:20px;padding:1px 6px;border-radius:99px;background:var(--warn-bg);color:var(--warn);font-size:11.5px;font-family:var(--font-body)}
#tab{display:flex;flex-direction:column;gap:14px}
.lead{margin:0;color:var(--muted);font-size:13.5px;max-width:75ch}
.foot{margin:0;padding:10px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.muted{color:var(--muted)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
@media (max-width:420px){.qgrid{grid-template-columns:1fr}}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.qcard header{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}

.qcard header span{font-size:12.5px;color:var(--muted)}

.qph{width:72px;height:56px;border-radius:8px;background:var(--sunk);border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--muted);text-align:center;padding:2px}

.qinfo{font-size:13px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:0}
.qinfo select{font-size:12.5px;padding:5px 6px;max-width:100%}
.bu{font-family:var(--font-mono);font-size:11px;color:var(--muted);background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:0 4px}

.qbtn button[data-d="ok"][aria-pressed="true"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.qbtn button[data-d="rej"][aria-pressed="true"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}

.matrix{min-width:420px}

.picks{display:flex;flex-wrap:wrap;gap:6px}.picks button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:700;font-size:13.5px}.picks button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

<header class="top"><div class="top-in"><div class="brand"><b>TS POSM Report</b><span>Weekly POSM report sa RMAS</span></div></div></header>
<main><div class="wrap" id="app"></div></main>
<div id="toast" class="toast" role="status" hidden></div>
<script>
// Ilagay dito ang Web app URL ng Google Apps Script. Kapag blangko, demo mode (sample data).
const CONFIG = { API_URL: 'https://script.google.com/macros/s/AKfycbzOXONKJwDUX2JgJCs5FCO8i-bTritwKvky_0jh_gTozRQjTVLuTC8_pz5oDSJNrxjxhg/exec' };
// ===== Shared core: helpers, sample data, data model =====
const DEMO = !CONFIG.API_URL;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const NOW = new Date();
const TODAY = ymd(NOW);
const CUR_MONTH = TODAY.slice(0, 7);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTH_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function prevMonth(m){ let [y, mo] = m.split('-').map(Number); mo--; if (!mo) { mo = 12; y--; } return y + '-' + pad(mo); }
const daysIn = m => new Date(+m.slice(0,4), +m.slice(5,7), 0).getDate();
const monthLabel = m => MONTH_FULL[+m.slice(5,7) - 1] + ' ' + m.slice(0,4);
const monthShort = m => MON[+m.slice(5,7) - 1];
const shortDate = d => d ? MON[+d.slice(5,7) - 1] + ' ' + (+d.slice(8,10)) : '';
const weekOf = d => { const x = +d.slice(8,10); return x <= 7 ? 1 : x <= 14 ? 2 : x <= 21 ? 3 : 4; };
const weekEnd = (m, w) => w >= 4 ? m + '-31' : m + '-' + pad(w * 7);
const CUR_WEEK = weekOf(TODAY);
const ST  = {ok:['Complete','p-ok'], ns:['Complete · No stock','p-ns'], inc:['Incomplete','p-bad']};
const DST = {ok:['Complete','p-ok'], ns:['Incomplete – No Stock','p-ns'], inc:['Incomplete','p-bad']};
const VST = {pending:['Pending check','p-warn'], ok:['Verified','p-acc'], rej:['Rejected','p-bad']};
const REASONS = ['Malabo ang photo','Hindi tugma ang status sa photo','Kulang ang kuha (hindi kita lahat ng POSM)','Ibang store o display ang nasa photo','Mukhang lumang photo'];
const pill = (t, c) => `<span class="pill ${c}">${esc(t)}</span>`;
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const paceFor = w => Math.round(80 * w / 4);
function bar(p, w){ return `<div class="bar" role="img" aria-label="${p}%"><i style="width:${Math.min(100,p)}%"></i>${w ? `<span class="pace" style="left:${paceFor(w)}%"></span>` : ''}<span class="t80"></span></div>`; }
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3200); }
function lsGet(k){ try { return localStorage.getItem(k); } catch(e) { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e) {} }

// ----- API (Google Apps Script web app) -----
async function apiGet(params){
  const u = CONFIG.API_URL + '?' + new URLSearchParams(params).toString();
  const r = await fetch(u); const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'May error sa server.'); return j;
}
async function apiPost(body){
  const r = await fetch(CONFIG.API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body)});
  const j = await r.json(); if (!j.ok) throw new Error(j.error || 'May error sa server.'); return j;
}

// ----- Sample data (demo mode only) -----
function rng(s){ return function(){ s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function sampleData(){
  const R = rng(20261019), pick = a => a[Math.floor(R() * a.length)];
  const BU = {'Ref':'HA','Washer':'HA','Microwave':'HA','Aircon':'AC','TV / AV':'AV'};
  const DISP = ['Ref','Washer','TV / AV','Aircon','Microwave'];
  const CHAINS = ['SM Appliance Center','Abenson',"Anson's",'Western Appliances','Automatic Centre','Robinsons Appliances','Emcor'];
  const TS = [
    {name:'Ramon Villanueva',region:'Cavite North',p:['Bacoor','Imus','Kawit','Dasmariñas','Molino'],n:22,rate:.74},
    {name:'Joy Mercado',region:'Cavite South',p:['Tagaytay','Silang','GMA','Gen. Trias','Trece Martires'],n:18,rate:.47},
    {name:'Paolo Reyes',region:'Laguna',p:['Sta. Rosa','Calamba','Biñan','San Pedro','Los Baños'],n:24,rate:.82},
    {name:'Liza Fernandez',region:'Batangas',p:['Lipa','Batangas City','Tanauan','Sto. Tomas'],n:16,rate:.36},
    {name:'Mark Domingo',region:'Rizal',p:['Antipolo','Cainta','Taytay','Binangonan'],n:20,rate:.63},
    {name:'Grace Aquino',region:'Quezon',p:['Lucena','Tayabas','Sariaya','Candelaria'],n:15,rate:.56}
  ];
  const stores = [], used = new Set(), reports = [];
  let rid = 0, row = 0;
  const pm = prevMonth(CUR_MONTH), today = +TODAY.slice(8,10);
  const st = () => { const x = R(); return x < .63 ? 'ok' : x < .78 ? 'ns' : 'inc'; };
  TS.forEach((t, ti) => {
    for (let i = 0; i < t.n; i++) {
      let nm, k = 0; do { nm = pick(CHAINS) + ' ' + pick(t.p) + (k > 2 ? ' ' + k : ''); k++; } while (used.has(nm)); used.add(nm);
      const ds = DISP.filter((d, j) => j < 2 ? R() < .92 : R() < .45); if (!ds.length) ds.push('Ref');
      stores.push({code:'S' + (ti + 1) + pad(i + 1), name:nm, ts:t.name, region:t.region, displays: i === t.n - 1 ? [] : ds, noPhoto:R() < .08});
    }
  });
  stores.forEach(s => {
    if (!s.displays.length) return;
    const t = TS.find(x => x.name === s.ts);
    const add = (date, v, reason) => { rid++; s.displays.forEach(d => reports.push({row:'r' + (++row), rid:'R' + rid, date, month:date.slice(0,7), ts:s.ts, store:s.code, display:d, status:st(), photo:'', v, reason:reason || ''})); };
    const missedLast = R() > .86;
    if (!missedLast) add(pm + '-' + pad(1 + Math.floor(R() * daysIn(pm))), 'ok');
    if (R() < Math.min(.97, t.rate + (missedLast ? .2 : 0))) {
      const day = 1 + Math.floor(R() * today), date = CUR_MONTH + '-' + pad(day);
      let v = 'pending', reason = '';
      if (day <= today - 3) { if (R() < .08) { v = 'rej'; reason = pick(REASONS); } else v = 'ok'; }
      add(date, v, reason);
    }
  });
  return {ts: TS.map(t => ({name:t.name, region:t.region})), stores, bu:BU, displayTypes:DISP, reports, lastVerified:[]};
}

// ----- Data model -----
// Rules:
//  • A store counts as "reported" in a month if it has a submission that was not rejected.
//  • If the latest submission of the month has a rejected display, the TS must redo the store.
//  • Official status of a display = its latest VERIFIED report (any month). Pending reports do not count yet.
function makeModel(D){
  const subs = {};   // store -> [{rid,date,month,rows,rej,pend}]
  D.reports.forEach(r => {
    const list = subs[r.store] = subs[r.store] || [];
    let g = list.find(x => x.rid === r.rid);
    if (!g) { g = {rid:r.rid, date:r.date, month:r.month, ts:r.ts, store:r.store, rows:[], rej:false, pend:false}; list.push(g); }
    g.rows.push(r); if (r.v === 'rej') g.rej = true; if (r.v === 'pending') g.pend = true;
  });
  Object.values(subs).forEach(l => l.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.rid < b.rid ? -1 : 1)));
  const lv = {}; (D.lastVerified || []).forEach(x => lv[x.store + '|' + x.display] = x);
  const buOf = d => D.bu[d] || 'Other';
  const M = {
    buOf,
    bus: [...new Set(Object.values(D.bu).concat(D.stores.flatMap(s => s.displays.map(buOf))))].sort(),
    subsOf: (code, m, asOf) => (subs[code] || []).filter(g => (!m || g.month === m) && (!asOf || g.date <= asOf)),
    allSubs: (m, asOf) => Object.values(subs).flat().filter(g => g.month === m && (!asOf || g.date <= asOf)),
    reportedIn(code, m, asOf){ return M.subsOf(code, m, asOf).some(g => !g.rej); },
    latestSub(code, m, asOf){ const l = M.subsOf(code, m, asOf); return l[l.length - 1] || null; },
    needsRedo(code, m, asOf){ const g = M.latestSub(code, m, asOf); return !!(g && g.rej); },
    displayStatus(code, d, asOf){
      let best = null;
      (subs[code] || []).forEach(g => { if (asOf && g.date > asOf) return; g.rows.forEach(r => { if (r.display === d && r.v === 'ok' && (!best || r.date >= best.date)) best = r; }); });
      if (!best) { const x = lv[code + '|' + d]; if (x && (!asOf || x.date <= asOf)) best = x; }
      return best;
    },
    storeStatus(s, asOf, bu){
      const ds = s.displays.filter(d => !bu || buOf(d) === bu); if (!ds.length) return null;
      const ks = [], dates = [];
      ds.forEach(d => { const b = M.displayStatus(s.code, d, asOf); if (b) { ks.push(b.status); dates.push(b.date); } });
      if (!ks.length) return null;
      return {k: ks.includes('inc') ? 'inc' : ks.includes('ns') ? 'ns' : 'ok', date: dates.sort().pop(), partial: ks.length < ds.length};
    }
  };
  return M;
}
function storeSummary(k){ return k ? ST[k] : null; }
function subStatus(g){ const ks = g.rows.map(r => r.status); return ks.includes('inc') ? 'inc' : ks.includes('ns') ? 'ns' : 'ok'; }

// ===== TS phone app =====
const S = {me: lsGet('tsposm-me'), view:'list', store:null, draft:null, D:null, M:null, tsList:[], err:'', busy:false};
const app = document.getElementById('app');

async function boot(){
  if (DEMO) {
    S.D = sampleData(); S.M = makeModel(S.D); S.tsList = S.D.ts;
    if (!S.me || !S.tsList.some(t => t.name === S.me)) S.me = S.tsList[0].name;
    return render();
  }
  app.innerHTML = '<div class="phone"><div class="empty">Kinukuha ang stores mo…</div></div>';
  try {
    S.tsList = (await apiGet({action:'tslist'})).ts;
    if (S.me && S.tsList.some(t => t.name === S.me)) await loadMine(); else S.me = null;
  } catch(e) { S.err = e.message; }
  render();
}
async function loadMine(){
  const j = await apiGet({action:'data', ts:S.me, month:CUR_MONTH});
  S.D = j; S.M = makeModel(j);
}

function render(){
  if (S.err) { app.innerHTML = `<div class="phone"><div class="errbox"><b>Hindi ma-load ang data.</b><br>${esc(S.err)}<br><br><button class="btn" id="retry">Subukan ulit</button></div></div>`; document.getElementById('retry').onclick = () => { S.err = ''; boot(); }; return; }
  if (!S.me) return renderPick();
  if (S.view === 'store' && S.store) return renderStore();
  renderList();
}

function renderPick(){
  app.innerHTML = `<div class="phone">
    <div class="store-h"><h2>Sino ka?</h2><p>Piliin ang pangalan mo. Isang beses lang ito sa phone na ito.</p></div>
    <label class="field">Trade Supervisor<select id="pick">${S.tsList.map(t => `<option>${esc(t.name)}</option>`).join('')}</select></label>
    <button class="btn" id="go">Ituloy</button></div>`;
  document.getElementById('go').onclick = async () => {
    S.me = document.getElementById('pick').value; lsSet('tsposm-me', S.me);
    app.innerHTML = '<div class="phone"><div class="empty">Kinukuha ang stores mo…</div></div>';
    try { await loadMine(); } catch(e) { S.err = e.message; }
    render();
  };
}

function renderList(){
  const M = S.M, pm = prevMonth(CUR_MONTH);
  const mine = S.D.stores.filter(s => s.ts === S.me);
  const redo = mine.filter(s => M.needsRedo(s.code, CUR_MONTH));
  const isDone = s => M.reportedIn(s.code, CUR_MONTH) && !M.needsRedo(s.code, CUR_MONTH);
  const carry = mine.filter(s => !isDone(s) && !M.needsRedo(s.code, CUR_MONTH) && !M.reportedIn(s.code, pm));
  const todo = mine.filter(s => !isDone(s) && !M.needsRedo(s.code, CUR_MONTH) && M.reportedIn(s.code, pm));
  const done = mine.filter(isDone);
  const n = mine.length, rep = done.length, p = pct(rep, n), need = Math.max(0, Math.ceil(n * .8) - rep);
  const statusPill = p >= 80 ? pill('Met 80%','p-ok') : p >= paceFor(CUR_WEEK) ? pill('On track','p-acc') : pill('Behind','p-bad');
  const row = (s, extra) => {
    const g = M.latestSub(s.code, CUR_MONTH);
    let tags = s.noPhoto ? pill('No-Photo','p-warn') : '';
    if (extra === 'redo') tags += pill('Ulitin','p-bad');
    else if (g && isDone(s)) tags += pill(ST[subStatus(g)][0], ST[subStatus(g)][1]) + pill(VST[g.pend ? 'pending' : 'ok'][0], VST[g.pend ? 'pending' : 'ok'][1]);
    const sub = extra === 'redo' ? (g.rows.find(r => r.v === 'rej') || {}).reason || 'Na-reject ng RMAS' : `${s.displays.length ? s.displays.length + ' display' + (s.displays.length > 1 ? 's' : '') : 'Unang report · pipiliin ang displays'}${g && isDone(s) ? ' · na-report ' + shortDate(g.date) : ''}`;
    return `<button class="row" data-store="${esc(s.code)}"><span class="main"><span class="nm">${esc(s.name)}</span><span class="sub">${esc(sub)}</span>${tags ? `<span class="tags">${tags}</span>` : ''}</span><span class="chev" aria-hidden="true">›</span></button>`;
  };
  const section = (title, list, kind, emptyText) => (list.length || emptyText) ? `<div class="sect"><span>${title}</span><span class="num">${list.length}</span></div><div class="list">${list.length ? list.map(s => row(s, kind)).join('') : `<div class="empty">${emptyText}</div>`}</div>` : '';
  app.innerHTML = `<div class="phone">
    ${DEMO ? `<div class="demo-note"><b>Demo mode:</b> sample data ito. Piliin kung sinong TS ang gusto mong subukan.</div>
      <label class="field">Trade Supervisor (demo)<select id="tspick">${S.tsList.map(t => `<option${t.name === S.me ? ' selected' : ''}>${esc(t.name)}</option>`).join('')}</select></label>` : `<div class="hello"><span>Hi, <b>${esc(S.me)}</b></span><button class="linkbtn" id="notme">Hindi ikaw?</button></div>`}
    <section class="prog" aria-label="Progress ngayong buwan">
      <div class="prog-head"><div class="big num">${rep}<small> / ${n} stores</small></div>${statusPill}</div>
      ${bar(p, CUR_WEEK)}
      <div class="prog-foot"><span class="num">${p}% · ${monthLabel(CUR_MONTH)} · Week ${CUR_WEEK} of 4</span><span>${need ? `${need} store pa para sa 80%` : 'Naabot na ang 80% ✓'}</span></div>
    </section>
    ${section('Ulitin · na-reject ng RMAS', redo, 'redo')}
    ${section('Priority · hindi nabisita noong ' + monthShort(pm), carry, 'carry')}
    ${section('Hindi pa nare-report', todo, 'todo', carry.length || redo.length ? '' : 'Lahat ng stores mo na-report na ngayong buwan.')}
    ${section('Na-report na ngayong buwan', done, 'done', 'Wala pa.')}
  </div>`;
  const tp = document.getElementById('tspick'); if (tp) tp.onchange = e => { S.me = e.target.value; lsSet('tsposm-me', S.me); render(); };
  const nm = document.getElementById('notme'); if (nm) nm.onclick = () => { S.me = null; lsSet('tsposm-me', ''); render(); };
  app.querySelectorAll('[data-store]').forEach(b => b.onclick = () => openStore(b.dataset.store));
}

function openStore(code){
  S.store = S.D.stores.find(x => x.code === code); S.view = 'store'; S.draft = {res:{}, photos:{}, pick:[]};
  render(); window.scrollTo(0, 0);
}

function renderStore(){
  const s = S.store, d = S.draft, M = S.M, first = !s.displays.length, dlist = first ? d.pick : s.displays;
  const types = S.D.displayTypes || Object.keys(S.D.bu || {});
  const prev = M.latestSub(s.code, CUR_MONTH), redo = M.needsRedo(s.code, CUR_MONTH);
  const missing = dlist.filter(x => !d.res[x] || (!s.noPhoto && !d.photos[x]));
  const rejRows = redo ? prev.rows.filter(r => r.v === 'rej') : [];
  app.innerHTML = `<div class="phone">
    <button class="back" id="back">‹ My Stores</button>
    <div class="store-h"><h2>${esc(s.name)}</h2><p>${esc(s.region)}${s.noPhoto ? ' ' + pill('No-Photo Store','p-warn') : ''}${prev && !redo ? ' · Na-report na: ' + shortDate(prev.date) : ''}</p></div>
    ${redo ? `<div class="errbox"><b>Na-reject ng RMAS (${shortDate(prev.date)}):</b><ul>${rejRows.map(r => `<li>${esc(r.display)}: ${esc(r.reason || 'Walang dahilan na binigay')}</li>`).join('')}</ul>Kunan ulit at i-submit ang buong store.</div>` : ''}
    ${first ? `<section class="disp pickbox" aria-label="Displays sa store"><h3>Anong displays ang meron dito?</h3>
      <p class="hint" style="text-align:left;margin:0">Unang report sa store na ito. Piliin lahat ng Samsung display na naka-set up. Ise-save ito para sa susunod na report; RMAS lang ang makakapagbago.</p>
      <div class="picks">${types.map(t => `<button data-pick="${esc(t)}" aria-pressed="${dlist.includes(t)}">${esc(t)}</button>`).join('')}</div></section>` : ''}
    ${dlist.map((x, i) => `<section class="disp" aria-label="${esc(x)}">
      <h3>${esc(x)} ${d.res[x] ? pill(DST[d.res[x]][0], DST[d.res[x]][1]) : ''}</h3>
      ${s.noPhoto ? `<div class="nophoto">Bawal mag-picture sa store na ito (naka-tag ng RMAS). Status lang ang kailangan.</div>` :
      `<label class="cam" for="cam-${i}">${d.photos[x] ? `<img src="${d.photos[x]}" alt="Photo ng ${esc(x)} display"><span class="retake">Kunan ulit</span>` : '📷 Kunan ng picture ang display'}<input id="cam-${i}" type="file" accept="image/*" capture="environment" data-d="${esc(x)}"></label>`}
      <div class="choices" role="group" aria-label="Status ng ${esc(x)}">
        ${['ok','ns','inc'].map(v => `<button data-d="${esc(x)}" data-v="${v}" aria-pressed="${d.res[x] === v}">${v === 'ok' ? 'Complete' : v === 'ns' ? 'Incomplete<br>No Stock' : 'Incomplete'}</button>`).join('')}
      </div></section>`).join('')}
    <div class="submit">
      <button class="btn" id="send" ${missing.length || !dlist.length || S.busy ? 'disabled' : ''}>${S.busy ? 'Sine-send…' : 'Submit report'}</button>
      <div class="hint">${first && !dlist.length ? 'Pumili muna ng displays na meron sa store.' : missing.length ? `Kulang pa: ${missing.map(esc).join(', ')}${s.noPhoto ? '' : ' (picture + status)'}` : 'Kumpleto na. Pwede nang i-submit.'}</div>
    </div></div>`;
  document.getElementById('back').onclick = () => { S.view = 'list'; render(); };
  app.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { const t = b.dataset.pick; d.pick = d.pick.includes(t) ? d.pick.filter(x => x !== t) : types.filter(x => x === t || d.pick.includes(x)); renderStore(); });
  app.querySelectorAll('.choices button').forEach(b => b.onclick = () => { d.res[b.dataset.d] = b.dataset.v; renderStore(); });
  app.querySelectorAll('.cam input').forEach(inp => inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    if (f.lastModified && Date.now() - f.lastModified > 10 * 60 * 1000) { inp.value = ''; toast('Luma na ang photo na ito. Kumuha ng bagong picture gamit ang camera.'); return; }
    const fr = new FileReader();
    fr.onload = () => stamp(fr.result, `${s.name} · ${inp.dataset.d}`, `${S.me} · ${new Date().toLocaleString('en-PH', {dateStyle:'medium', timeStyle:'short'})}`, url => { d.photos[inp.dataset.d] = url; renderStore(); });
    fr.readAsDataURL(f);
  });
  document.getElementById('send').onclick = submit;
}

async function submit(){
  const s = S.store, d = S.draft, dlist = s.displays.length ? s.displays : d.pick;
  const items = dlist.map(x => ({display:x, status:d.res[x], photo: s.noPhoto ? '' : d.photos[x]}));
  if (DEMO) {
    const rid = 'R' + Date.now();
    items.forEach((it, i) => S.D.reports.push({row:rid + '-' + i, rid, date:TODAY, month:CUR_MONTH, ts:S.me, store:s.code, display:it.display, status:it.status, photo:it.photo, v:'pending', reason:''}));
    if (!s.displays.length) s.displays = dlist.slice();
    S.M = makeModel(S.D); S.view = 'list'; render(); window.scrollTo(0, 0); toast('Na-submit: ' + s.name); return;
  }
  S.busy = true; renderStore();
  try {
    await apiPost({action:'submit', ts:S.me, store:s.code, items});
    await loadMine(); S.busy = false; S.view = 'list'; render(); window.scrollTo(0, 0); toast('Na-submit: ' + s.name);
  } catch(e) { S.busy = false; renderStore(); toast('Hindi na-send: ' + e.message + ' Subukan ulit.'); }
}

// Resize + watermark (store, display, TS, date/time) burned into the photo.
function stamp(src, line1, line2, cb){
  const im = new Image();
  im.onload = () => {
    const m = 1100, sc = Math.min(1, m / Math.max(im.width, im.height));
    const c = document.createElement('canvas'); c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
    const g = c.getContext('2d'); g.drawImage(im, 0, 0, c.width, c.height);
    const fs = Math.max(14, Math.round(c.width / 34)), h = fs * 2.9;
    g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(0, c.height - h, c.width, h);
    g.fillStyle = '#fff'; g.font = `600 ${fs}px system-ui, sans-serif`; g.textBaseline = 'top';
    g.fillText(line1, fs * .6, c.height - h + fs * .35, c.width - fs * 1.2);
    g.font = `${Math.round(fs * .85)}px system-ui, sans-serif`;
    g.fillText(line2, fs * .6, c.height - h + fs * 1.6, c.width - fs * 1.2);
    try { cb(c.toDataURL('image/jpeg', .78)); } catch(e) { cb(src); }
  };
  im.onerror = () => cb(src); im.src = src;
}

boot();
